name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: ./make-dmg.sh

      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg \
              --title "Clock Overlay $GITHUB_REF_NAME" \
              --generate-notes
          fi
